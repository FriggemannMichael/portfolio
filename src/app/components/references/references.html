<section class="references-section" *transloco="let t">
  <h2 class="references-section__headline" appScrollAnimate animation="fade-up">
    {{ t('references.headline') }}
  </h2>

  <div class="references-grid" #gridRef (scroll)="onScroll($event)">
    @for (reference of references(); track reference.id; let i = $index) {
      <article class="reference-card" appScrollAnimate animation="scale-in" [delay]="i * 100">
        <app-hover-ellipse
          [defaultSvg]="'/icon/refeelips01.svg'"
          [hoverSvg]="'/icon/refelips02.svg'"
        >
          <div class="reference-card__content">
            <div class="reference-card__header">
              <h3 class="reference-card__name">{{ t(reference.nameKey) }}</h3>
              <p class="reference-card__project">{{ t(reference.projectKey) }}</p>
            </div>

            <p class="reference-card__quote">{{ t(reference.quoteKey) }}</p>

            <a
              [href]="reference.linkedInUrl"
              class="reference-card__link"
              target="_blank"
              rel="noopener noreferrer"
            >
              <!-- {{ t('references.linkedInLink') }} -->
            </a>
          </div>
        </app-hover-ellipse>
      </article>
    }
  </div>

  <nav class="references-pagination" aria-label="Reference navigation">
    @for (reference of references(); track reference.id; let i = $index) {
      <button
        type="button"
        class="references-pagination__dot"
        [class.references-pagination__dot--active]="activeIndex() === i"
        (click)="scrollToSlide(i)"
        [attr.aria-label]="'Go to reference ' + (i + 1)"
        [attr.aria-current]="activeIndex() === i ? 'true' : null"
      ></button>
    }
  </nav>
</section>
