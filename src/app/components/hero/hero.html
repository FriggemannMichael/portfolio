<section class="hero" *transloco="let t">
  <!-- Mobile Header (nur < 1024px sichtbar) -->
  <div class="hero__header">
    <app-logo class="hero__logo--mobile" [priority]="true" />
    <app-social-media class="hero__social--mobile" />
    <app-burger-menu
      class="hero__burger-menu"
      [showOverlay]="false"
      [class.hero__burger-menu--open]="isMenuOpen()"
      (navigate)="onNavigate($event)"
      (menuToggle)="onMenuToggle($event)"
    />
  </div>

  <!-- Main Grid: Bild links, Content rechts -->
  <div class="hero__main">
    <!-- Linke Spalte: Bild -->
    @if (!isMenuOpen()) {
      <app-hero-image class="hero__image" />
    } @else {
      <div class="hero__image hero__menu">
        <div class="menu-container">
          <div class="bg-shape">
            <img src="/mobil/hero/shapebgmob.svg" alt="" />
          </div>
          <div class="menu-items">
            <button class="menu-button" (click)="onNavigate('about')">
              <span class="menu-text">Why me</span>
            </button>
            <button class="menu-button" (click)="onNavigate('skills')">
              <span class="menu-text">Skills</span>
            </button>
            <button class="menu-button" (click)="onNavigate('portfolio')">
              <span class="menu-text">Projects</span>
            </button>
            <button class="menu-button" (click)="onNavigate('contact')">
              <span class="menu-text">Contact</span>
            </button>
          </div>
          <div class="menu-language">
            <app-language-switcher variant="compact" (languageChange)="onLanguageChange($event)" />
          </div>
        </div>
      </div>
    }

    <!-- Rechte Spalte: Content mit 3 Zonen -->
    <div class="hero__content">
      <!-- Obere Zone: Logo zentriert, Social rechts oben -->
      <div class="hero__zone-top">
        <app-logo class="hero__logo" [priority]="true" />
        <app-social-media class="hero__social" />
      </div>

      <!-- Mittlere Zone: Name und Titel zentriert -->
      <div class="hero__zone-center">
        <h1 class="hero__name">{{ t('hero.name') }}</h1>
        <h2 class="hero__title">{{ t('hero.title') }}</h2>
      </div>

      <!-- Untere Zone: Arrow zentriert -->
      <div class="hero__zone-bottom">
        <app-arrow-btn direction="down" class="hero__arrow" (click)="scrollToNext()" />
      </div>
    </div>
  </div>
</section>

<!-- Navigation direkt nach Hero (außerhalb für sticky) -->
<app-navigation></app-navigation>
