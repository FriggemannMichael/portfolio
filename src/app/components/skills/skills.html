<section id="skills" class="skills-section" *transloco="let t">
  <h2 class="skills-headline" appScrollAnimate animation="fade-up">{{ t('skills.headline') }}</h2>

  <div class="skills-content">
    <!-- Skill Set -->
    <div class="skill-set" appScrollAnimate animation="fade-up" [delay]="100">
      @for (skill of skills(); track skill.name) {
        <div class="skill-item">
          <div class="skill-icon">
            <img [src]="'icon/' + skill.icon" [alt]="skill.name" />
          </div>
          <span class="skill-name">{{ skill.name }}</span>
        </div>
      }
    </div>

    <!-- Currently Learning -->
    <div class="currently-learning" appScrollAnimate animation="fade-up" [delay]="200">
      <app-skill-ellipse>
        <div class="learning-content">
          <p class="learning-title">{{ t('skills.learning.title') }}</p>

          <div class="learning-body">
            <p class="learning-text">{{ t('skills.learning.description') }}</p>

            <div class="learning-icons">
              @for (skill of learningSkills(); track skill.name) {
                <div class="learning-item">
                  <div class="learning-icon">
                    <img [src]="'icon/' + skill.icon" [alt]="skill.name" />
                  </div>
                  <span class="learning-name">{{ skill.name }}</span>
                </div>
              }
            </div>
          </div>
        </div>
      </app-skill-ellipse>
    </div>
  </div>

  <a href="#contact" class="mobile-cta" appScrollAnimate animation="fade-up">
    <app-button text="Let's Talk" variant="white"></app-button>
  </a>
</section>
