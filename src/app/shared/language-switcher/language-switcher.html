<!-- language-switcher.html -->
<div class="language-switcher" *transloco="let t">
  <button
    class="language-btn"
    [class.active]="isGerman()"
    (click)="selectLanguage('de')"
    type="button"
    [attr.aria-label]="t('languageSwitcher.selectGerman')"
    [attr.aria-pressed]="isGerman()"
  >
    DE
  </button>
  <button
    class="language-btn"
    [class.active]="isEnglish()"
    (click)="selectLanguage('en')"
    type="button"
    [attr.aria-label]="t('languageSwitcher.selectEnglish')"
    [attr.aria-pressed]="isEnglish()"
  >
    EN
  </button>
</div>
